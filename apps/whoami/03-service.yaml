# Service de type ClusterIP : il reçoit seulement une adresse interne, joignable
# depuis l'intérieur du cluster (pas de NodePort ni d'adresse externe). L'accès
# depuis l'extérieur passe par la Gateway du cluster, à laquelle la route de
# 04-httproute.yaml confie le nom whoami.lab.internal.
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: demo
  labels:
    app.kubernetes.io/name: whoami
    app.kubernetes.io/part-of: lab-k8s-gitops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
