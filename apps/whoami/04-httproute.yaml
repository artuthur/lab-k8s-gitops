# La route : « les requêtes pour whoami.lab.internal, arrivées sur la Gateway du
# cluster, vont au Service whoami ». Elle appartient à l'application, comme son
# Deployment ; la Gateway, elle, appartient à l'infrastructure.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: demo
  labels:
    app.kubernetes.io/name: whoami
    app.kubernetes.io/part-of: lab-k8s-gitops
spec:
  # La Gateway à laquelle la route se rattache, et son écouteur HTTP
  parentRefs:
    - name: lab-gateway
      namespace: gateway
      sectionName: http
  hostnames:
    - whoami.lab.internal
  rules:
    # Sans condition (matches) : tous les chemins, à partir de « / »
    - backendRefs:
        - name: whoami
          port: 80
