---
# Paquets Kubernetes : kubeadm, kubelet et (sur le control plane) kubectl.
# Référence : https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/install-kubeadm/

- name: Installer les dépendances de gestion des dépôts APT
  ansible.builtin.apt:
    name:
      - python3-debian
      - ca-certificates
    state: present

# Dépôt « à plat » : la suite se termine par « / » et il n'y a pas de composant.
- name: Déclarer le dépôt APT de Kubernetes
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "{{ kubernetes_packages_repo_url }}"
    suites: /
    signed_by: "{{ kubernetes_packages_repo_key_url }}"
    state: present

- name: Construire la liste des paquets à installer sur ce nœud
  ansible.builtin.set_fact:
    kubernetes_packages_list: >-
      {{ kubernetes_packages_base
         + (['kubectl'] if kubernetes_packages_install_kubectl | bool else []) }}

- name: Installer les paquets Kubernetes
  ansible.builtin.apt:
    name: "{{ kubernetes_packages_list }}"
    state: present
    update_cache: true

# Bloquer les versions : kubeadm, kubelet et kubectl se mettent à jour ensemble,
# selon une procédure précise (kubeadm upgrade), jamais par un « apt upgrade ».
- name: Bloquer la version des paquets Kubernetes
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubernetes_packages_list }}"

# Sans ce fichier, crictl essaie plusieurs sockets connus et affiche des
# avertissements avant de trouver celui de containerd.
- name: Indiquer à crictl le socket du runtime
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix://{{ kubernetes_packages_cri_socket }}
      image-endpoint: unix://{{ kubernetes_packages_cri_socket }}
    owner: root
    group: root
    mode: "0644"

# Contrôle de bout en bout : crictl joint containerd par le socket du CRI,
# exactement comme le fera le kubelet. Échoue si le CRI est désactivé.
- name: Vérifier que crictl joint le runtime par le CRI
  ansible.builtin.command: crictl version
  register: kubernetes_packages_crictl_version
  changed_when: false
  check_mode: false

# Activé seulement (il démarrera au prochain démarrage de la VM), pas démarré :
# sans configuration, il s'arrêterait aussitôt et redémarrerait en boucle.
# C'est kubeadm init / kubeadm join qui le démarrera en phase 3, après avoir
# écrit sa configuration.
- name: Activer le kubelet au démarrage
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
