<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Les trois chemins réseau entre Windows et une VM du lab</title>
  <desc>Vagrant se connecte pendant le démarrage par 127.0.0.1:2222 et le service NAT de VMware jusqu'à eth0 ; c'est cette connexion qui est coupée quand eth1 est désactivée. vagrant ssh se connecte directement à eth0 depuis 192.168.5.1 et n'est pas affecté. Ansible joint eth1 par le réseau VMnet3.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="430" rx="12" fill="#FFFFFF"/>

  <rect x="30" y="30" width="300" height="330" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="50" y="56" font-size="14" font-weight="500" fill="#444441">Windows (hôte)</text>

  <rect x="60" y="72" width="240" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="180" y="93" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Vagrant (démarrage)</text>
  <text x="180" y="112" text-anchor="middle" font-size="12" fill="#993C1D">vers 127.0.0.1:2222</text>

  <rect x="60" y="144" width="240" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="180" y="165" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Service NAT de VMware</text>
  <text x="180" y="184" text-anchor="middle" font-size="12" fill="#993C1D">redirige depuis 192.168.5.2</text>

  <rect x="60" y="216" width="240" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="180" y="237" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">vagrant ssh</text>
  <text x="180" y="256" text-anchor="middle" font-size="12" fill="#0F6E56">en direct depuis 192.168.5.1</text>

  <rect x="60" y="288" width="240" height="52" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="180" y="309" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Ansible (WSL2)</text>
  <text x="180" y="328" text-anchor="middle" font-size="12" fill="#5F5E5A">via VMnet3 · 192.168.58.1</text>

  <rect x="400" y="30" width="250" height="330" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="420" y="56" font-size="14" font-weight="500" fill="#3C3489">VM k8s-cp-01</text>

  <rect x="430" y="126" width="190" height="52" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
  <text x="525" y="147" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">eth0</text>
  <text x="525" y="166" text-anchor="middle" font-size="12" fill="#534AB7">192.168.5.151 · VMnet8</text>

  <rect x="430" y="276" width="190" height="52" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
  <text x="525" y="297" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">eth1</text>
  <text x="525" y="316" text-anchor="middle" font-size="12" fill="#534AB7">192.168.58.10 · VMnet3</text>

  <line x1="180" y1="124" x2="180" y2="142" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M300 170 L365 170 L365 145 L428 145" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M300 242 L382 242 L382 160 L428 160" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M300 314 L365 314 L365 302 L428 302" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="40" y1="388" x2="70" y2="388" stroke="#993C1D" stroke-width="1.5"/>
  <text x="80" y="392" font-size="12" fill="#444441">Chemin de Vagrant : coupé quand eth1 est désactivée</text>
  <line x1="40" y1="412" x2="70" y2="412" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="80" y="416" font-size="12" fill="#444441">Chemin de vagrant ssh : non affecté</text>
</svg>
