<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>MetalLB en mode L2</title>
  <desc>Windows demande par ARP qui possède l'adresse 192.168.58.50. Le speaker élu, sur k8s-worker-02, répond avec l'adresse MAC de son nœud. Le trafic arrive donc sur k8s-worker-02, où kube-proxy l'envoie vers l'un des pods whoami, sur ce nœud ou sur k8s-worker-01. Le speaker de k8s-worker-01 reste en réserve. Le control plane est exclu des annonces.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="490" rx="12" fill="#FFFFFF"/>

  <rect x="30" y="80" width="170" height="90" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="115" y="117" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Windows / WSL2</text>
  <text x="115" y="138" text-anchor="middle" font-size="12" fill="#5F5E5A">curl 192.168.58.50</text>

  <rect x="240" y="30" width="410" height="200" rx="16" fill="none" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="5 4"/>
  <text x="258" y="54" font-size="14" font-weight="500" fill="#444441">k8s-worker-02</text>
  <text x="372" y="54" font-size="12" fill="#5F5E5A">élu pour 192.168.58.50</text>
  <rect x="260" y="74" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="345" y="96" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">speaker</text>
  <text x="345" y="115" text-anchor="middle" font-size="12" fill="#0F6E56">« .50, c'est moi »</text>
  <rect x="450" y="74" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="540" y="96" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">kube-proxy</text>
  <text x="540" y="115" text-anchor="middle" font-size="12" fill="#5F5E5A">choisit un pod</text>
  <rect x="450" y="156" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="540" y="178" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Pod whoami</text>
  <text x="540" y="197" text-anchor="middle" font-size="12" fill="#534AB7">10.244.118.x</text>

  <rect x="240" y="260" width="410" height="120" rx="16" fill="none" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="5 4"/>
  <text x="258" y="284" font-size="14" font-weight="500" fill="#444441">k8s-worker-01</text>
  <rect x="260" y="304" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="345" y="326" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">speaker</text>
  <text x="345" y="345" text-anchor="middle" font-size="12" fill="#0F6E56">en réserve</text>
  <rect x="450" y="304" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="540" y="326" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Pod whoami</text>
  <text x="540" y="345" text-anchor="middle" font-size="12" fill="#534AB7">10.244.36.x</text>

  <rect x="240" y="400" width="410" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="445" y="427" text-anchor="middle" font-size="12" fill="#444441">k8s-cp-01 : exclu des annonces (étiquette posée par kubeadm)</text>

  <g stroke="#5F5E5A" stroke-width="1.5" fill="none">
    <line x1="258" y1="100" x2="202" y2="100" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <path d="M200 146 L440 146 L440 108 L448 108" marker-end="url(#arrow)"/>
    <line x1="540" y1="130" x2="540" y2="154" marker-end="url(#arrow)"/>
    <path d="M630 102 L644 102 L644 332 L632 332" marker-end="url(#arrow)"/>
  </g>
  <text x="30" y="474" font-size="12" fill="#444441">Pointillés : réponse ARP du speaker élu. Trait plein : le trafic HTTP. Nœud élu relevé dans le lab le 06/11/2026.</text>
</svg>
