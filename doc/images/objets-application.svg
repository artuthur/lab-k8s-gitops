<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Les objets d'une application dans Kubernetes</title>
  <desc>Dans un namespace, un Deployment décrit l'application et le nombre de copies voulues. Il crée un ReplicaSet, qui crée et maintient les pods. Un Service sélectionne ces pods par leur étiquette app.kubernetes.io/name=whoami et leur donne une adresse stable ; de type LoadBalancer, il reçoit aussi une adresse externe de MetalLB.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="470" rx="12" fill="#FFFFFF"/>

  <rect x="30" y="30" width="620" height="410" rx="18" fill="none" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="5 4"/>
  <text x="50" y="56" font-size="14" font-weight="500" fill="#444441">Namespace demo</text>
  <text x="196" y="56" font-size="12" fill="#5F5E5A">un espace de noms : une « pièce » du cluster</text>

  <rect x="60" y="80" width="250" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="185" y="102" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">Deployment whoami</text>
  <text x="185" y="121" text-anchor="middle" font-size="12" fill="#854F0B">« je veux 2 copies de cette image »</text>

  <rect x="60" y="170" width="250" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="185" y="192" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">ReplicaSet whoami-dd4d65c86</text>
  <text x="185" y="211" text-anchor="middle" font-size="12" fill="#854F0B">maintient exactement 2 pods</text>

  <rect x="60" y="264" width="115" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="117" y="288" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Pod</text>
  <text x="117" y="306" text-anchor="middle" font-size="12" fill="#534AB7">...-szpd2</text>
  <text x="117" y="322" text-anchor="middle" font-size="11" fill="#534AB7">10.244.36.x</text>
  <rect x="195" y="264" width="115" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="252" y="288" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Pod</text>
  <text x="252" y="306" text-anchor="middle" font-size="12" fill="#534AB7">...-wklsx</text>
  <text x="252" y="322" text-anchor="middle" font-size="11" fill="#534AB7">10.244.118.x</text>

  <rect x="60" y="356" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="185" y="378" text-anchor="middle" font-size="12" fill="#444441">étiquette des pods :</text>
  <text x="185" y="397" text-anchor="middle" font-size="12" fill="#444441" font-family="Consolas, Menlo, monospace">app.kubernetes.io/name=whoami</text>

  <rect x="390" y="170" width="240" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="510" y="194" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Service whoami</text>
  <text x="510" y="212" text-anchor="middle" font-size="12" fill="#0F6E56">ClusterIP 10.107.70.103</text>
  <text x="510" y="228" text-anchor="middle" font-size="12" fill="#0F6E56">sélectionne les pods par étiquette</text>

  <rect x="390" y="80" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="510" y="102" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Adresse externe</text>
  <text x="510" y="121" text-anchor="middle" font-size="12" fill="#0F6E56">192.168.58.50, attribuée par MetalLB</text>

  <g stroke="#5F5E5A" stroke-width="1.5" fill="none">
    <line x1="185" y1="136" x2="185" y2="168" marker-end="url(#arrow)"/>
    <line x1="140" y1="226" x2="117" y2="262" marker-end="url(#arrow)"/>
    <line x1="230" y1="226" x2="252" y2="262" marker-end="url(#arrow)"/>
    <line x1="510" y1="136" x2="510" y2="168" marker-end="url(#arrow)"/>
  </g>
  <path d="M450 240 L450 299 L312 299" fill="none" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="462" y="266" font-size="12" fill="#0F6E56">trafic réparti</text>
  <text x="462" y="282" font-size="12" fill="#0F6E56">entre les pods</text>

  <text x="390" y="362" font-size="12" fill="#444441">Flèches pleines : « crée et surveille ».</text>
  <text x="390" y="382" font-size="12" fill="#444441">Pointillés : le Service retrouve les pods</text>
  <text x="390" y="400" font-size="12" fill="#444441">grâce à leur étiquette, où qu'ils soient.</text>
</svg>
