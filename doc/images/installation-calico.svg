<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Installation de Calico par son opérateur</title>
  <desc>Ansible applique trois fichiers : les CRD qui ajoutent de nouveaux types d'objets, l'opérateur, puis la ressource Installation qui décrit ce que l'on veut. L'opérateur lit cette ressource et crée lui-même les composants de Calico, dont calico-node sur chaque nœud. calico-node installe le CNI sur son nœud, qui passe Ready ; CoreDNS peut alors démarrer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="500" rx="12" fill="#FFFFFF"/>

  <rect x="100" y="20" width="460" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="330" y="42" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">1. Les CRD de Calico</text>
  <text x="330" y="61" text-anchor="middle" font-size="12" fill="#854F0B">de nouveaux types d'objets : Installation, IPPool, NetworkPolicy...</text>

  <rect x="100" y="102" width="460" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="330" y="124" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">2. L'opérateur Tigera</text>
  <text x="330" y="143" text-anchor="middle" font-size="12" fill="#854F0B">un programme qui sait installer et entretenir Calico</text>

  <rect x="100" y="184" width="460" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="330" y="206" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">3. La ressource Installation</text>
  <text x="330" y="225" text-anchor="middle" font-size="12" fill="#854F0B">ce que l'on veut : pool 10.244.0.0/16, adresse des nœuds</text>

  <rect x="100" y="274" width="460" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="330" y="296" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">L'opérateur crée les composants</text>
  <text x="330" y="315" text-anchor="middle" font-size="12" fill="#0F6E56">dans calico-system : calico-node sur chaque nœud, typha, webhooks...</text>

  <rect x="100" y="356" width="460" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="330" y="378" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">calico-node prépare son nœud</text>
  <text x="330" y="397" text-anchor="middle" font-size="12" fill="#0F6E56">plugin CNI dans /opt/cni/bin, configuration dans /etc/cni/net.d, routes</text>

  <rect x="100" y="438" width="460" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="330" y="465" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Nœuds Ready, CoreDNS démarre</text>

  <g stroke="#5F5E5A" stroke-width="1.5">
    <line x1="330" y1="76" x2="330" y2="100" marker-end="url(#arrow)"/>
    <line x1="330" y1="158" x2="330" y2="182" marker-end="url(#arrow)"/>
    <line x1="330" y1="240" x2="330" y2="272" marker-end="url(#arrow)"/>
    <line x1="330" y1="330" x2="330" y2="354" marker-end="url(#arrow)"/>
    <line x1="330" y1="412" x2="330" y2="436" marker-end="url(#arrow)"/>
  </g>

  <rect x="580" y="22" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="580" y="54" font-size="12" fill="#444441">Ansible</text>
  <rect x="580" y="276" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="580" y="308" font-size="12" fill="#444441">Le cluster</text>
</svg>
