<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>La chaîne d'exécution d'un conteneur et son analogie avec une cuisine</title>
  <desc>À gauche, les composants qui lancent un conteneur sur un nœud : kubelet, CRI, containerd, shim, runc, processus du conteneur. À droite, leur équivalent dans la cuisine d'un restaurant : chef de cuisine, bon de commande standard, cuisinier, commis, allumeur de feu, plat qui cuit.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="560" rx="12" fill="#FFFFFF"/>

  <text x="170" y="40" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Sur le nœud</text>
  <text x="510" y="40" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Dans la cuisine d'un restaurant</text>

  <g font-size="14">
    <rect x="40" y="60" width="260" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="170" y="81" text-anchor="middle" font-weight="500" fill="#3C3489">kubelet</text>
    <text x="170" y="100" text-anchor="middle" font-size="12" fill="#534AB7">sait quoi faire tourner</text>

    <rect x="40" y="140" width="260" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="170" y="161" text-anchor="middle" font-weight="500" fill="#444441">CRI (containerd.sock)</text>
    <text x="170" y="180" text-anchor="middle" font-size="12" fill="#5F5E5A">format standard des demandes</text>

    <rect x="40" y="220" width="260" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="170" y="241" text-anchor="middle" font-weight="500" fill="#085041">containerd</text>
    <text x="170" y="260" text-anchor="middle" font-size="12" fill="#0F6E56">images, stockage, délégation</text>

    <rect x="40" y="300" width="260" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="170" y="321" text-anchor="middle" font-weight="500" fill="#085041">containerd-shim-runc-v2</text>
    <text x="170" y="340" text-anchor="middle" font-size="12" fill="#0F6E56">un par pod, surveille</text>

    <rect x="40" y="380" width="260" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="170" y="401" text-anchor="middle" font-weight="500" fill="#085041">runc</text>
    <text x="170" y="420" text-anchor="middle" font-size="12" fill="#0F6E56">crée le conteneur, puis s'arrête</text>

    <rect x="40" y="460" width="260" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="170" y="481" text-anchor="middle" font-weight="500" fill="#633806">Processus du conteneur</text>
    <text x="170" y="500" text-anchor="middle" font-size="12" fill="#854F0B">isolé et limité par le noyau</text>
  </g>

  <g font-size="14">
    <rect x="380" y="60" width="260" height="52" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="510" y="81" text-anchor="middle" font-weight="500" fill="#444441">Le chef de cuisine</text>
    <text x="510" y="100" text-anchor="middle" font-size="12" fill="#5F5E5A">reçoit les commandes, ne cuisine pas</text>

    <rect x="380" y="140" width="260" height="52" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="510" y="161" text-anchor="middle" font-weight="500" fill="#444441">Le bon de commande</text>
    <text x="510" y="180" text-anchor="middle" font-size="12" fill="#5F5E5A">même format pour tout cuisinier</text>

    <rect x="380" y="220" width="260" height="52" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="510" y="241" text-anchor="middle" font-weight="500" fill="#444441">Le cuisinier</text>
    <text x="510" y="260" text-anchor="middle" font-size="12" fill="#5F5E5A">va chercher les kits, les prépare</text>

    <rect x="380" y="300" width="260" height="52" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="510" y="321" text-anchor="middle" font-weight="500" fill="#444441">Le commis</text>
    <text x="510" y="340" text-anchor="middle" font-size="12" fill="#5F5E5A">surveille une poêle en continu</text>

    <rect x="380" y="380" width="260" height="52" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="510" y="401" text-anchor="middle" font-weight="500" fill="#444441">L'allumeur de feu</text>
    <text x="510" y="420" text-anchor="middle" font-size="12" fill="#5F5E5A">allume la plaque, puis s'en va</text>

    <rect x="380" y="460" width="260" height="52" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="510" y="481" text-anchor="middle" font-weight="500" fill="#444441">Le plat qui cuit</text>
    <text x="510" y="500" text-anchor="middle" font-size="12" fill="#5F5E5A">sur son poste, avec sa plaque</text>
  </g>

  <g stroke="#5F5E5A" stroke-width="1.5">
    <line x1="170" y1="112" x2="170" y2="138" marker-end="url(#arrow)"/>
    <line x1="170" y1="192" x2="170" y2="218" marker-end="url(#arrow)"/>
    <line x1="170" y1="272" x2="170" y2="298" marker-end="url(#arrow)"/>
    <line x1="170" y1="352" x2="170" y2="378" marker-end="url(#arrow)"/>
    <line x1="170" y1="432" x2="170" y2="458" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4">
    <line x1="300" y1="86" x2="380" y2="86"/>
    <line x1="300" y1="166" x2="380" y2="166"/>
    <line x1="300" y1="246" x2="380" y2="246"/>
    <line x1="300" y1="326" x2="380" y2="326"/>
    <line x1="300" y1="406" x2="380" y2="406"/>
    <line x1="300" y1="486" x2="380" y2="486"/>
  </g>
  <text x="340" y="540" text-anchor="middle" font-size="12" fill="#5F5E5A">Chaque flèche est une délégation : chacun ne fait qu'une chose et passe la main.</text>
</svg>
