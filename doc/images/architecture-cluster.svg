<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Architecture du cluster kubeadm du lab</title>
  <desc>Le poste de contrôle WSL2 pilote le cluster avec kubectl et Ansible. Le control plane k8s-cp-01 contient l'API server, etcd, le scheduler et les controllers. Les workers k8s-worker-01 et k8s-worker-02 contiennent chacun le kubelet et containerd et exécutent les pods.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="490" rx="12" fill="#FFFFFF"/>

  <rect x="220" y="30" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="52" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Poste de contrôle WSL2</text>
  <text x="340" y="72" text-anchor="middle" font-size="12" fill="#5F5E5A">kubectl, Ansible</text>

  <line x1="340" y1="86" x2="340" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="130" width="600" height="134" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="60" y="154" font-size="14" font-weight="500" fill="#3C3489">k8s-cp-01 (control plane)</text>
  <text x="60" y="172" font-size="12" fill="#534AB7">192.168.58.10 · décide, n'exécute pas les applis</text>

  <rect x="61" y="188" width="126" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="124" y="211" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">API server</text>
  <text x="124" y="230" text-anchor="middle" font-size="12" fill="#0F6E56">porte d'entrée</text>

  <rect x="205" y="188" width="126" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="268" y="211" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">etcd</text>
  <text x="268" y="230" text-anchor="middle" font-size="12" fill="#0F6E56">base d'état</text>

  <rect x="349" y="188" width="126" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="412" y="211" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Scheduler</text>
  <text x="412" y="230" text-anchor="middle" font-size="12" fill="#0F6E56">place les pods</text>

  <rect x="493" y="188" width="126" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="556" y="211" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Controllers</text>
  <text x="556" y="230" text-anchor="middle" font-size="12" fill="#0F6E56">état désiré</text>

  <line x1="185" y1="264" x2="185" y2="318" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="495" y1="264" x2="495" y2="318" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="320" width="290" height="131" rx="20" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="58" y="344" font-size="14" font-weight="500" fill="#712B13">k8s-worker-01</text>
  <text x="58" y="362" font-size="12" fill="#993C1D">192.168.58.11 · exécute les pods</text>

  <rect x="350" y="320" width="290" height="131" rx="20" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="368" y="344" font-size="14" font-weight="500" fill="#712B13">k8s-worker-02</text>
  <text x="368" y="362" font-size="12" fill="#993C1D">192.168.58.12 · exécute les pods</text>

  <rect x="55" y="375" width="125" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="117" y="398" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">kubelet</text>
  <text x="117" y="417" text-anchor="middle" font-size="12" fill="#854F0B">agent du nœud</text>

  <rect x="190" y="375" width="125" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="252" y="398" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">containerd</text>
  <text x="252" y="417" text-anchor="middle" font-size="12" fill="#854F0B">exécute</text>

  <rect x="365" y="375" width="125" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="427" y="398" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">kubelet</text>
  <text x="427" y="417" text-anchor="middle" font-size="12" fill="#854F0B">agent du nœud</text>

  <rect x="500" y="375" width="125" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="562" y="398" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">containerd</text>
  <text x="562" y="417" text-anchor="middle" font-size="12" fill="#854F0B">exécute</text>
</svg>
