<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Une image et deux conteneurs qui la partagent</title>
  <desc>Une image est un empilement de couches en lecture seule : système de base, logiciel, configuration. Deux conteneurs créés à partir de la même image partagent ces couches ; chacun n'ajoute qu'une fine couche modifiable qui lui est propre.</desc>
  <rect x="0" y="0" width="680" height="430" rx="12" fill="#FFFFFF"/>

  <rect x="150" y="40" width="170" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="235" y="62" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">Conteneur A</text>
  <text x="235" y="82" text-anchor="middle" font-size="12" fill="#854F0B">couche modifiable</text>

  <rect x="360" y="40" width="170" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="445" y="62" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">Conteneur B</text>
  <text x="445" y="82" text-anchor="middle" font-size="12" fill="#854F0B">couche modifiable</text>

  <rect x="130" y="120" width="420" height="230" rx="16" fill="none" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="5 4"/>
  <text x="340" y="336" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Image nginx (exemple), en lecture seule</text>

  <rect x="150" y="135" width="380" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="165" text-anchor="middle" font-size="14" fill="#085041">Couche 3 : fichiers de configuration de nginx</text>
  <rect x="150" y="195" width="380" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="225" text-anchor="middle" font-size="14" fill="#085041">Couche 2 : le programme nginx</text>
  <rect x="150" y="255" width="380" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="285" text-anchor="middle" font-size="14" fill="#085041">Couche 1 : système de base (fichiers Debian)</text>

  <line x1="235" y1="96" x2="235" y2="133" stroke="#854F0B" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="445" y1="96" x2="445" y2="133" stroke="#854F0B" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="340" y="380" text-anchor="middle" font-size="12" fill="#444441">Les couches de l'image sont stockées une seule fois sur le nœud et partagées.</text>
  <text x="340" y="402" text-anchor="middle" font-size="12" fill="#444441">Ce qu'un conteneur écrit va dans sa couche à lui, et disparaît avec lui.</text>
</svg>
