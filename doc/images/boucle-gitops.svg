<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>La boucle GitOps d'Argo CD</title>
  <desc>Cinq étapes : tu pousses un commit sur GitHub ; l'applicationset-controller liste les dossiers de apps/ et crée une Application par dossier ; le repo-server clone le dépôt et lit les fichiers ; l'application-controller compare le dépôt au cluster et applique les écarts ; en continu, il surveille le cluster et annule les modifications faites à la main. À droite, les deux états d'une application : la synchronisation (Synced ou OutOfSync) et la santé (Healthy, Progressing, Degraded, Missing).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="470" rx="12" fill="#FFFFFF"/>

  <text x="20" y="30" font-size="14" font-weight="500" fill="#444441">La boucle</text>
  <text x="370" y="30" font-size="14" font-weight="500" fill="#444441">Les deux états d'une application</text>

  <g font-size="12">
    <rect x="20" y="44" width="330" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <circle cx="44" cy="76" r="12" fill="#5F5E5A"/><text x="44" y="80" text-anchor="middle" fill="#FFFFFF" font-weight="500">1</text>
    <text x="66" y="66" font-size="14" font-weight="500" fill="#444441">Tu pousses un commit</text>
    <text x="66" y="84" fill="#5F5E5A">git push vers GitHub : le dépôt décrit</text>
    <text x="66" y="99" fill="#5F5E5A">ce qui doit tourner dans le cluster</text>

    <rect x="20" y="122" width="330" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <circle cx="44" cy="154" r="12" fill="#854F0B"/><text x="44" y="158" text-anchor="middle" fill="#FFFFFF" font-weight="500">2</text>
    <text x="66" y="144" font-size="14" font-weight="500" fill="#633806">applicationset-controller</text>
    <text x="66" y="162" fill="#854F0B">liste les dossiers de apps/ : une</text>
    <text x="66" y="177" fill="#854F0B">Application par dossier (ici whoami)</text>

    <rect x="20" y="200" width="330" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <circle cx="44" cy="232" r="12" fill="#854F0B"/><text x="44" y="236" text-anchor="middle" fill="#FFFFFF" font-weight="500">3</text>
    <text x="66" y="222" font-size="14" font-weight="500" fill="#633806">repo-server</text>
    <text x="66" y="240" fill="#854F0B">clone le dépôt et lit les fichiers</text>
    <text x="66" y="255" fill="#854F0B">de apps/whoami/ (environ toutes les 3 min)</text>

    <rect x="20" y="278" width="330" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <circle cx="44" cy="310" r="12" fill="#0F6E56"/><text x="44" y="314" text-anchor="middle" fill="#FFFFFF" font-weight="500">4</text>
    <text x="66" y="300" font-size="14" font-weight="500" fill="#085041">application-controller</text>
    <text x="66" y="318" fill="#0F6E56">compare le dépôt au cluster, et</text>
    <text x="66" y="333" fill="#0F6E56">applique les écarts (synchronisation)</text>

    <rect x="20" y="356" width="330" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <circle cx="44" cy="388" r="12" fill="#534AB7"/><text x="44" y="392" text-anchor="middle" fill="#FFFFFF" font-weight="500">5</text>
    <text x="66" y="378" font-size="14" font-weight="500" fill="#3C3489">En continu</text>
    <text x="66" y="396" fill="#534AB7">il surveille le cluster : une modification</text>
    <text x="66" y="411" fill="#534AB7">faite à la main est annulée (selfHeal)</text>
  </g>

  <g stroke="#0F6E56" stroke-width="1.5" fill="none">
    <line x1="185" y1="108" x2="185" y2="120" marker-end="url(#arrow)"/>
    <line x1="185" y1="186" x2="185" y2="198" marker-end="url(#arrow)"/>
    <line x1="185" y1="264" x2="185" y2="276" marker-end="url(#arrow)"/>
    <line x1="185" y1="342" x2="185" y2="354" marker-end="url(#arrow)"/>
  </g>

  <rect x="370" y="44" width="290" height="180" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="384" y="68" font-size="13" font-weight="500" fill="#444441">Synchronisation (SYNC STATUS)</text>
  <text x="384" y="86" font-size="12" fill="#5F5E5A">le cluster est-il conforme au dépôt ?</text>
  <g font-size="12">
    <text x="384" y="114" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">Synced</text>
    <text x="474" y="114" fill="#5F5E5A">identique au dépôt</text>
    <text x="384" y="140" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">OutOfSync</text>
    <text x="474" y="140" fill="#5F5E5A">un écart, dans un sens</text>
    <text x="474" y="156" fill="#5F5E5A">ou dans l'autre</text>
    <text x="384" y="184" font-size="11" fill="#5F5E5A">Avec la synchronisation automatique, un</text>
    <text x="384" y="200" font-size="11" fill="#5F5E5A">OutOfSync ne dure que le temps de corriger.</text>
  </g>

  <rect x="370" y="240" width="290" height="180" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="384" y="264" font-size="13" font-weight="500" fill="#444441">Santé (HEALTH STATUS)</text>
  <text x="384" y="282" font-size="12" fill="#5F5E5A">ce qui tourne fonctionne-t-il ?</text>
  <g font-size="12">
    <text x="384" y="310" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">Healthy</text>
    <text x="474" y="310" fill="#5F5E5A">tout est prêt</text>
    <text x="384" y="334" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">Progressing</text>
    <text x="474" y="334" fill="#5F5E5A">en cours (démarrage,</text>
    <text x="474" y="350" fill="#5F5E5A">mise à jour)</text>
    <text x="384" y="376" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">Degraded</text>
    <text x="474" y="376" fill="#5F5E5A">en échec (pods en erreur)</text>
    <text x="384" y="400" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">Missing</text>
    <text x="474" y="400" fill="#5F5E5A">absent du cluster</text>
  </g>

  <text x="20" y="452" font-size="12" fill="#444441">Argo CD va chercher le dépôt : rien n'est poussé vers le cluster depuis l'extérieur.</text>
</svg>
