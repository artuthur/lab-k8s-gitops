<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Ce que kubeadm init écrit dans /etc/kubernetes</title>
  <desc>kubeadm init écrit trois familles de fichiers : la PKI (autorité de certification et certificats), les kubeconfigs (adresse de l'API server et certificat d'accès) et les manifestes des static pods. Le kubelet lit les manifestes et lance les composants du control plane dans containerd.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="480" rx="12" fill="#FFFFFF"/>

  <rect x="30" y="30" width="620" height="250" rx="16" fill="none" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="5 4"/>
  <text x="50" y="54" font-size="14" font-weight="500" fill="#444441">/etc/kubernetes, écrit par kubeadm init</text>

  <rect x="45" y="70" width="190" height="190" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="140" y="94" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">pki/</text>
  <text x="140" y="112" text-anchor="middle" font-size="12" fill="#534AB7">CA et certificats</text>
  <g font-size="12" fill="#3C3489" font-family="Consolas, Menlo, monospace">
    <text x="60" y="144">ca.crt, ca.key</text>
    <text x="60" y="166">apiserver.crt</text>
    <text x="60" y="188">etcd/ (sa propre CA)</text>
    <text x="60" y="210">front-proxy-ca.crt</text>
    <text x="60" y="232">sa.key, sa.pub</text>
  </g>

  <rect x="250" y="70" width="190" height="190" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="345" y="94" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Kubeconfigs (*.conf)</text>
  <text x="345" y="112" text-anchor="middle" font-size="12" fill="#0F6E56">adresse + certificat</text>
  <g font-size="12" fill="#085041" font-family="Consolas, Menlo, monospace">
    <text x="265" y="144">admin.conf</text>
    <text x="265" y="166">super-admin.conf</text>
    <text x="265" y="188">kubelet.conf</text>
    <text x="265" y="210">controller-manager.conf</text>
    <text x="265" y="232">scheduler.conf</text>
  </g>

  <rect x="455" y="70" width="180" height="190" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="545" y="94" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">manifests/</text>
  <text x="545" y="112" text-anchor="middle" font-size="12" fill="#854F0B">4 static pods</text>
  <g font-size="11" fill="#633806" font-family="Consolas, Menlo, monospace">
    <text x="467" y="144">kube-apiserver.yaml</text>
    <text x="467" y="166">etcd.yaml</text>
    <text x="467" y="188">kube-scheduler.yaml</text>
    <text x="467" y="210">kube-controller-</text>
    <text x="467" y="226">  manager.yaml</text>
  </g>

  <rect x="45" y="320" width="395" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="242" y="342" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Tout est signé par la CA du cluster</text>
  <text x="242" y="362" text-anchor="middle" font-size="12" fill="#5F5E5A">un kubeconfig = l'adresse de l'API server + un certificat d'accès</text>

  <rect x="455" y="320" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
  <text x="545" y="342" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">kubelet</text>
  <text x="545" y="362" text-anchor="middle" font-size="12" fill="#534AB7">lit le dossier en continu</text>

  <rect x="455" y="404" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="545" y="426" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Control plane</text>
  <text x="545" y="446" text-anchor="middle" font-size="12" fill="#0F6E56">lancé dans containerd</text>

  <g stroke="#5F5E5A" stroke-width="1.5" fill="none">
    <line x1="545" y1="260" x2="545" y2="318" marker-end="url(#arrow)"/>
    <line x1="545" y1="376" x2="545" y2="402" marker-end="url(#arrow)"/>
    <line x1="140" y1="260" x2="140" y2="318" marker-end="url(#arrow)"/>
    <line x1="345" y1="260" x2="345" y2="318" marker-end="url(#arrow)"/>
  </g>
</svg>
