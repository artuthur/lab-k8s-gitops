# Noms d'hôtes = identifiants Vagrant (config.vm.define) = noms d'hôtes Linux,
# pour que le script de synchronisation des clés SSH et Kubernetes voient les mêmes noms.
# Noms de groupes explicites et différents des noms d'hôtes.

[control_plane]
k8s-cp-01 ansible_host=192.168.58.10

[workers]
k8s-worker-01 ansible_host=192.168.58.11
k8s-worker-02 ansible_host=192.168.58.12

[k8s_cluster:children]
control_plane
workers
