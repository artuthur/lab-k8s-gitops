---
# Des VMs tout juste créées peuvent rester injoignables quelques secondes après la
# fin de « vagrant up » : lors de la reconstruction du 10/11/2026, le premier passage
# n'a pu joindre qu'un nœud sur trois, et il a fallu relancer le playbook. Attendre
# la connexion SSH de chaque nœud, plutôt que d'échouer au premier essai.
# Pas de collecte des faits ici : elle échouerait sur un nœud encore injoignable.
- name: Attendre que les nœuds soient joignables
  hosts: k8s_cluster
  gather_facts: false
  tasks:
    - name: Attendre la connexion SSH à chaque nœud
      ansible.builtin.wait_for_connection:
        timeout: 300

- name: Configuration de base de tous les nœuds
  hosts: k8s_cluster
  become: true
  roles:
    - common
    - k8s_prereqs

- name: Container runtime et paquets Kubernetes sur tous les nœuds
  hosts: k8s_cluster
  become: true
  roles:
    - containerd
    - kubernetes_packages

- name: Création du cluster sur le control plane
  hosts: control_plane
  become: true
  roles:
    - kubeadm_init

- name: Ajout des workers au cluster
  hosts: workers
  become: true
  roles:
    - kubeadm_join

# Après l'ajout des workers : Calico attend que tous les nœuds soient prêts.
- name: Réseau des pods (Calico)
  hosts: control_plane
  become: true
  roles:
    - calico

# Après Calico : le contrôleur de MetalLB est un pod ordinaire, qui a besoin du réseau des pods.
- name: Adresses externes des Services (MetalLB)
  hosts: control_plane
  become: true
  roles:
    - metallb

- name: Point d'entrée du cluster (Gateway)
  hosts: control_plane
  become: true
  roles:
    - envoy_gateway

- name: GitOps (Argo CD)
  hosts: control_plane
  become: true
  roles:
    - argocd

- name: Vérification du cluster
  hosts: control_plane
  become: true
  roles:
    - cluster_verify
